services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      MAX_ROOMS: "100"
    expose:
      - "8080"
    mem_limit: 512m
    cpus: 1.0
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:?Set ARENA_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
volumes:
  caddy_data:
  caddy_config:
